[workspace]
members = ["crates/misa-plan", "crates/misa-image", "crates/misa-exec", "crates/misa-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_jcs = "0.2.0"
sha2 = "0.10.9"
jsonschema = { version = "0.58.6", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = "2.2"
getrandom = "0.3"
hex = "0.4"
flate2 = "1"
tar = "0.4"
rustix = { version = "1", features = ["fs", "process"] }
fs2 = "0.4"
tempfile = "3"
walkdir = "2"
