[workspace]
members = ["crates/misa-plan", "crates/misa-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
serde = "1.0.228"
serde_json = "1.0.145"
serde_jcs = "0.2.0"
sha2 = "0.10.9"
jsonschema = { version = "0.58.6", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
