name: MisaOS verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plans-and-images:
    name: S0-S2 plans, signed OCI roots and stock-NixOS VMs
    # 24.04 denies the pinned bwrap's namespace setup (Ubuntu bug 2069526).
    # Keep every runtime test and the sandbox intact; never disable host policy.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node.js 24
        with:
          persist-credentials: false
      - name: Install pinned Nix
        uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
        with:
          nix_version: "2.29.2"
          enable_kvm: true
          nix_conf: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Rust conformance and real rootless OCI storage
        run: |
          nix develop --no-update-lock-file --no-write-lock-file "path:$PWD" \
            --command cargo test --workspace --locked --target-dir "$RUNNER_TEMP/misaos-target"
      - name: Check Nix plans, strata module and S1/S2 VMs
        run: |
          nix flake check --no-update-lock-file --no-write-lock-file "path:$PWD"
      - name: Run the S0 showcase without a VM
        run: |
          tool=$(nix build --no-update-lock-file --no-write-lock-file \
            --no-link --print-out-paths "path:$PWD#default")
          nix develop --no-update-lock-file --no-write-lock-file "path:$PWD" \
            --command env MISA_PLAN_BIN="$tool/bin/misa-plan" tests/vm/s0.sh
